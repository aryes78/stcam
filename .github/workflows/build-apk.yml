name: Build Samsung S24 Stereo Camera APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Wait 20 seconds for other workflows to unpack files
        run: |
          echo "Várakozás 20 másodpercig, amíg a fájlok kicsomagolása befejeződik..."
          sleep 20

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          if [ ! -f "gradlew" ] && [ -d "SamsungS24StereoCamera" ]; then
            cd SamsungS24StereoCamera
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S24-Stereo-Camera-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

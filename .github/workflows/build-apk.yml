name: Build Samsung S24 Stereo Camera APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Automatikusan telepíti a hivatalos Gradle 8.10.2-t a virtuális gépre
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Automatikus könyvtár-keresés és fallback (ha nincs gradlew, globális gradle-t használ)
      - name: Build Debug APK
        run: |
          # 1. Ha a projekt almappában van (pl. SamsungS24StereoCamera), belépünk oda
          if [ ! -f "build.gradle.kts" ] && [ -d "SamsungS24StereoCamera" ]; then
            echo "Belépés a SamsungS24StereoCamera mappába..."
            cd SamsungS24StereoCamera
          elif [ ! -f "build.gradle.kts" ]; then
            TARGET_DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -not -path "*/app/*" -exec dirname {} \; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Projekt megtalálva: $TARGET_DIR, belépés..."
              cd "$TARGET_DIR"
            fi
          fi

          echo "Aktuális munkakönyvtár: $(pwd)"
          ls -la

          # 2. Ha létezik a gradlew wrapper, azt futtatjuk; ha nem, a telepített Gradle parancsot!
          if [ -f "./gradlew" ]; then
            echo "✓ gradlew megtalálva, futtatás..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ℹ gradlew nem található a mappában, globális Gradle 8.10.2 futtatása..."
            gradle assembleDebug --stacktrace
          fi

      # Bármilyen mappamélységben megtalálja és feltölti az elkészült APK-t
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S24-Stereo-Camera-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

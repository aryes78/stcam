name: Samsung S24 Stereo Camera - Unpack & Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. KICSOMAGOLÁS, CLEANUP ÉS AUTOMATIKUS GIT COMMIT + PUSH
      # Ha van fajlok.zip vagy bármilyen zip, kibontja, committolja a repóba,
      # és azonnal a frissen kicsomagolt kódból folytatja a fordítást!
      - name: Unpack zip, update repo and prepare source
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "=========================================================="
            echo "Feltöltött ZIP fájl észlelve: $ZIP_FILE"
            echo "Kicsomagolás folyamatban a munkakönyvtárba..."
            echo "=========================================================="
            
            # Kicsomagolás felülírással, kizárva a futó workflow fájlokat
            unzip -o "$ZIP_FILE" -d . -x ".github/workflows/*"
            rm -f "$ZIP_FILE"
            echo "ZIP sikeresen kibontva és az archívum eltávolítva."

            # Ha a forráskód almappában volt a zip-en belül (pl. SamsungS24StereoCamera vagy android-app)
            if [ ! -f "gradlew" ]; then
              SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                echo "Forráskód felmozgatása almappából ($SUBDIR) a gyökérbe..."
                cp -r $SUBDIR/* .
              fi
            fi

            # Git commit és push: a kibontott friss forráskód rögzítése a repóban
            git config --local user.email "github-actions@users.noreply.github.com"
            git config --local user.name "github-actions"
            git add -A

            if git status --porcelain | grep -q .; then
              echo "A kibontott új fájlok committolása a repóba..."
              git commit -m "Automatikus kicsomagolás: forráskód frissítése [skip ci]"
              git push origin ${{ github.ref_name }} || git push origin HEAD:${{ github.ref_name }} || true
              echo "A frissített forráskód sikeresen feltöltve a távoli repóba!"
            else
              echo "Nem történt fájlváltozás, nincs szükség új commitra."
            fi
          else
            echo "Nem található feltöltött zip fájl, a repóban lévő meglévő forráskódból építünk."
            
            if [ ! -f "gradlew" ]; then
              SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \; | head -n 1)
              if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
                echo "Forráskód felmozgatása almappából ($SUBDIR) a gyökérbe..."
                cp -r $SUBDIR/* .
              fi
            fi
          fi

          chmod +x ./gradlew || true

      # 2. JAVA 17 KÖRNYEZET BEÁLLÍTÁSA
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. GRADLE KÖRNYEZET BEÁLLÍTÁSA
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 4. APK ÉPÍTÉSE A FRISSEN KICSOMAGOLT KÓDBÓL
      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 5. S24StereoCamera.apk ÁTNEVEZÉSE ÉS ELŐKÉSZÍTÉSE
      - name: Prepare S24StereoCamera.apk
        run: |
          mkdir -p dist-apk
          APK_FOUND=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find . -name "*.apk" | head -n 1)
          fi

          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" dist-apk/S24StereoCamera.apk
            echo "Sikeres átnevezés: dist-apk/S24StereoCamera.apk"
          else
            echo "HIBA: Nem található lefordított apk fájl!"
            exit 1
          fi

      # 6. ARTIFACT FELTÖLTÉSE
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: S24StereoCamera-APK
          path: dist-apk/S24StereoCamera.apk

      # 7. DINAMIKUS RELEASE LEÍRÁS ÉS JOGOK
      - name: Generate release notes
        id: notes
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "Egyéni leírás beolvasása RELEASE_NOTES.md fájlból..."
            cat RELEASE_NOTES.md > release_body.txt
          else
            cat << 'EOF' > release_body.txt
### Samsung Galaxy S24 Sztereó Rendszer (v1.1.0)
- **Telepítő fájl:** [S24StereoCamera.apk](dist-apk/S24StereoCamera.apk)
- **Felbontás:** Full HD 1080p @ 30fps
- **Főkamera:** 2.79x hardveres központi kivágás (4-pixel Bayer RGGB igazítással, lila elszíneződés nélkül)
- **OIS (Optikai Képstabilizátor):** Videónál automatikusan kikapcsolva a merev, elmozdulásmentes sztereó tengelyért; Fotónál aktív a kézremegés ellen
- **Exponáló gombok:** 52dp margóval balra hozva a navigációs sáv elől
EOF
          fi
          echo "" >> release_body.txt
          echo "---" >> release_body.txt
          echo "- **Build azonosító:** #${{ github.run_number }}" >> release_body.txt
          echo "- **Időpont:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> release_body.txt
          echo "- **Forráskód commit:** ${{ github.sha }}" >> release_body.txt

      # 8. GITHUB RELEASE LÉTREHOZÁSA (MINDEN FUTÁSKOR ÚJ RELEASE SORSZÁMMAL!)
      - name: Create GitHub Release with S24StereoCamera.apk
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.1.0-b{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Samsung S24 Sztereó v1.1.0 (Build #{0})', github.run_number) }}
          body_path: release_body.txt
          draft: false
          prerelease: false
          files: |
            dist-apk/S24StereoCamera.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

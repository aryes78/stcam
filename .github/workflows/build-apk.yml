name: Build Samsung S24 Stereo Camera APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK (with subfolder detection & fallback)
        run: |
          # 1. Ha a projekt almappában van, automatikus belépés
          if [ ! -f "build.gradle.kts" ]; then
            for d in */ ; do
              if [ -f "${d}build.gradle.kts" ]; then
                echo "Projekt megtalálva: $d, belépés..."
                cd "$d"
                break
              fi
            done
          fi

          echo "Aktuális munkakönyvtár: $(pwd)"
          ls -la

          # 2. Automatikus XML entitás szanálás Pythonnal (100% hibabiztos)
          python3 -c "
import glob
for f in glob.glob('**/*.xml', recursive=True):
    try:
        with open(f, 'r', encoding='utf-8') as fp:
            text = fp.read()
        new_text = text.replace('Fotó & SBS', 'Fotó és SBS').replace(' & ', ' &amp; ')
        if new_text != text:
            with open(f, 'w', encoding='utf-8') as fp:
                fp.write(new_text)
            print('XML szanálva: ' + f)
    except Exception:
        pass
"

          # 3. Fordítás futtatása
          if [ -f "./gradlew" ]; then
            echo "✓ ./gradlew megtalálva, végrehajtási jog megadása..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ℹ Globális Gradle használata..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S24-Stereo-Camera-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

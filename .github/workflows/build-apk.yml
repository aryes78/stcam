name: Build Samsung S24 Stereo Camera APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK (with subfolder detection & fallback)
        run: |
          # 1. Ha a projekt almappában van (pl. SamsungS24StereoCamera), lépjünk be
          if [ ! -f "build.gradle.kts" ] && [ -d "SamsungS24StereoCamera" ]; then
            echo "Belépés a SamsungS24StereoCamera mappába..."
            cd SamsungS24StereoCamera
          elif [ ! -f "build.gradle.kts" ]; then
            TARGET_DIR=$(find . -maxdepth 2 -name "build.gradle.kts" -not -path "*/app/*" -exec dirname {} ; | head -n 1)
            if [ -n "$TARGET_DIR" ]; then
              echo "Projekt megtalálva: $TARGET_DIR, belépés..."
              cd "$TARGET_DIR"
            fi
          fi

          echo "Aktuális munkakönyvtár: $(pwd)"
          ls -la

          # 2. Automatikus XML entitás tisztítás (kivédi az árva '&' karakter miatti hibákat)
          echo "XML fájlok ellenőrzése és szanálása..."
          find . -name "*.xml" -type f -exec sed -i 's/ & / &amp; /g' {} +

          # 3. Ha létezik gradlew, futtatási jog megadása és futtatás
          if [ -f "./gradlew" ]; then
            echo "✓ ./gradlew megtalálva, végrehajtási jog megadása..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ℹ ./gradlew nincs jelen, globális Gradle 8.10.2 használata..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-S24-Stereo-Camera-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

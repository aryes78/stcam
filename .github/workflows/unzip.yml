name: Zip Kicsomagolasa
on:
  push:
    paths:
      - 'fajlok.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Jog a fájlok módosításához
      workflows: write  # KIFEJEZETT JOG a .github/workflows/ mappához!
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip files
        run: |
          unzip -o fajlok.zip -d .
          rm fajlok.zip

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions@://github.com"
          git config --local user.name "github-actions"
          git add .
          git commit -m "Automatikus kicsomagolas (workflow-val)" || echo "Nincs valtozas"
          git push origin HEAD:${{ github.ref_name }}

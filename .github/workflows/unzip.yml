name: Zip Kicsomagolása
on:
  push:
    paths:
      - 'fajlok.zip' # Akkor fut le, ha ez a fájl frissül

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Kibontás és push
        run: |
          unzip fajlok.zip -d kibontott_mappa/
          rm fajlok.zip
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name "github-actions"
          git add .
          git commit -m "Automatikus kicsomagolás"
          git push origin main
